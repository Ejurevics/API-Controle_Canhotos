services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-canhotos}
      POSTGRES_USER: ${DB_USERNAME:-canhotos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-canhotos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-canhotos}
      DB_USERNAME: ${DB_USERNAME:-canhotos}
      DB_PASSWORD: ${DB_PASSWORD:-canhotos}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-PT1H}
      JWT_CACHE_CREDENCIAL: ${JWT_CACHE_CREDENCIAL:-PT30S}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA no .env (veja .env.example)}
      LOGIN_MAX_FALHAS_POR_LOGIN: ${LOGIN_MAX_FALHAS_POR_LOGIN:-5}
      LOGIN_MAX_FALHAS_POR_IP: ${LOGIN_MAX_FALHAS_POR_IP:-20}
      LOGIN_JANELA: ${LOGIN_JANELA:-PT15M}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
