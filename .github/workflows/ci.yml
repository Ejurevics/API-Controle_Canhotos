name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Os testes de integração sobem um PostgreSQL via Testcontainers (Docker já vem no runner).
      - name: Build e testes
        run: ./mvnw -B clean verify

      # O verify já falha se a cobertura ficar abaixo do mínimo do pom.xml; aqui só publica o resultado.
      - name: Resumo da cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          # Colunas do CSV: 6/7 = branches perdidos/cobertos, 8/9 = linhas perdidas/cobertas.
          awk -F, 'NR>1 { bi+=$6; bc+=$7; li+=$8; lc+=$9 }
            END { printf "### Cobertura (JaCoCo)\n\n| Linhas | Branches |\n|---|---|\n| %.1f%% | %.1f%% |\n", 100*lc/(li+lc), 100*bc/(bi+bc) }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # Barra o PR que adiciona ou atualiza dependência com vulnerabilidade conhecida.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
